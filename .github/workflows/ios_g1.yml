name: G1 Source iOS
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'engine_src/**'
      - 'platform/**'
      - 'cmake/**'
      - 'resources/**'
      - 'tools/**'
      - 'CMakeLists.txt'
      - 'dependencies.lock.json'
      - '.github/workflows/ios_g1.yml'
permissions:
  contents: read
concurrency:
  group: gmod-g1-${{ github.ref }}
  cancel-in-progress: false
jobs:
  engine-ios:
    runs-on: macos-15
    timeout-minutes: 360
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_COMPILERCHECK: content
      CCACHE_MAXSIZE: 512M
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode with macOS 15 SDK
        run: sudo xcode-select --switch /Applications/Xcode_16.4.app/Contents/Developer
      - name: Record toolchain
        run: |
          xcode-select -p
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-version
          xcrun --sdk iphoneos --show-sdk-version
          uname -m
      - name: Test ANGLE wildcard matcher with buffer warnings enabled
        run: python3 tools/test_angle_wildcard.py build-host/angle-wildcard
      - name: Test static module registry
        run: |
          cmake -S . -B build-host -DGMOD_BUILD_ENGINE=OFF -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host --parallel 3
          ctest --test-dir build-host --output-on-failure
      - name: Fetch pinned dependencies
        run: python3 tools/bootstrap.py
      - name: Test Source interface registrations and loader
        run: |
          cmake -S . -B build-host -DGMOD_BUILD_ENGINE=OFF -DSOURCE_ENGINE_HEADERS="$PWD/deps/engine" -DCMAKE_BUILD_TYPE=Debug
          cmake --build build-host --parallel 3
          ctest --test-dir build-host --output-on-failure
      - name: Test Mach-O module isolation with real Source factories
        run: bash tests/test_module_isolation.sh "$PWD/deps/engine"
      - name: Install host build tools
        run: brew install ninja cmake ccache autoconf automake libtool gettext gperf pkg-config
      - uses: actions/cache/restore@v4
        id: compiled-objects
        with:
          path: .ccache
          key: ios-g1-objects-xcode16.4-${{ runner.arch }}-${{ hashFiles('dependencies.lock.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ios-g1-objects-xcode16.4-${{ runner.arch }}-${{ hashFiles('dependencies.lock.json') }}-
      - uses: actions/cache/restore@v4
        id: dependencies
        with:
          path: build-deps/install
          key: ios-g1-deps-xcode16.4-${{ runner.arch }}-${{ hashFiles('dependencies.lock.json', 'tools/build_deps.sh', 'tools/patch_thirdparty.py') }}
      - name: Cross-compile iPhone dependencies
        id: build-dependencies
        if: steps.dependencies.outputs.cache-hit != 'true'
        run: bash tools/build_deps.sh
      - name: Save completed dependencies before compiling the engine
        if: steps.build-dependencies.outcome == 'success' && steps.dependencies.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: build-deps/install
          key: ${{ steps.dependencies.outputs.cache-primary-key }}
      - name: Restore ANGLE Metal libraries
        id: angle-cache
        uses: actions/cache@v4
        with:
          path: build-deps/angle
          key: angle-metal-xcode16.4-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('tools/build_angle.sh', 'tools/patch_angle.py', 'tools/angle_wildcard_function.txt') }}
      - name: Build ANGLE Metal for iPhone
        if: steps.angle-cache.outputs.cache-hit != 'true'
        run: bash tools/build_angle.sh
      - name: Apply iOS platform patch
        run: python3 tools/patch_engine.py deps/engine
      - name: Configure static Source engine
        run: |
          cmake -S . -B build-ios -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_SYSTEM_NAME=iOS \
            -DCMAKE_OSX_SYSROOT=iphoneos -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 -DGMOD_BUILD_ENGINE=ON -DBUILD_TESTING=OFF \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_OBJC_COMPILER_LAUNCHER=ccache -DCMAKE_OBJCXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - name: Compile all Source modules and iPhone app
        id: engine-build
        timeout-minutes: 300
        run: |
          set -o pipefail
          cmake --build build-ios --parallel 3 -- -k 40 2>&1 | tee build-ios/compile.log
      - name: Record compiler cache statistics
        if: always() && steps.engine-build.outcome != 'skipped'
        run: ccache --show-stats
      - uses: actions/cache/save@v4
        if: always() && steps.engine-build.outcome != 'skipped'
        with:
          path: .ccache
          key: ${{ steps.compiled-objects.outputs.cache-primary-key }}
      - name: Package unsigned IPA
        run: python3 tools/package_ipa.py --app build-ios/GModPort.app --output artifacts/GModPort-unsigned.ipa
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: GModPort-unsigned
          path: artifacts/GModPort-unsigned.ipa
          if-no-files-found: error
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: G1-diagnostics
          path: |
            build-ios/compile.log
            build-ios/generated/source-manifest.json
            build-ios/CMakeFiles/CMakeConfigureLog.yaml
            build-angle/compile.log
            build-angle/angle/out/ios/args.gn
            build-angle/unsafe-buffers-setting.txt
          if-no-files-found: ignore
