// GModPort: SDL game controller layout (DualSense, Xbox, Switch Pro, MFi pads).
// Executed by in_joystick.cpp when a controller connects. Button names are SDL/Xbox positions:
// A = Cross, B = Circle, X = Square, Y = Triangle, BACK = Create, START = Options.
joy_name "Game controller"
joy_advanced 1
joy_advaxisx 3		// left stick X: strafe
joy_advaxisy 1		// left stick Y: forward
joy_advaxisz 0		// triggers are buttons (L_TRIGGER / R_TRIGGER)
joy_advaxisr 2		// right stick Y: pitch
joy_advaxisu 4		// right stick X: yaw
joy_advaxisv 0
joy_forwardsensitivity -1
joy_sidesensitivity 1
joy_pitchsensitivity 1.0
joy_yawsensitivity -1.25
joy_forwardthreshold 0.15
joy_sidethreshold 0.15
joy_pitchthreshold 0.15
joy_yawthreshold 0.15
joy_lowend 0.65
joy_lowmap 0.15
joy_accelscale 2.0
joy_accelmax 2.0
joy_response_move 0
joy_response_look 1
joystick 1
joy_xcontroller_cfg_loaded 2
joyadvancedupdate
+jlook

bind "R_TRIGGER" "+attack"
bind "L_TRIGGER" "+attack2"
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "+use"
bind "L_SHOULDER" "gmp_weapprev"
bind "R_SHOULDER" "gmp_weapnext"
bind "BACK" "+menu_context"
bind "START" "gameui_activate"
bind "STICK1" "gmp_run"
bind "STICK2" "impulse 100"
bind "UP" "+menu"
bind "DOWN" "noclip"
bind "LEFT" "gmod_undo"
bind "RIGHT" "gmp_toolnext"
