touch_enable 1
touch_draw 1
touch_forwardzone 0.12
touch_removeall
alias gmp_run_on "+speed; alias gmp_run gmp_run_off"
alias gmp_run_off "-speed; alias gmp_run gmp_run_on"
alias gmp_run gmp_run_on
touch_addbutton "move" "" "_move" 0.00 0.10 0.48 1.00
touch_addbutton "look" "" "_look" 0.48 0.10 1.00 1.00
touch_addbutton "jump" "vgui/touch/gmp_jump" "+jump" 0.86 0.70 0.98 0.90
touch_addbutton "duck" "vgui/touch/gmp_duck" "+duck" 0.72 0.76 0.84 0.96
touch_addbutton "fire" "vgui/touch/gmp_fire" "+attack" 0.84 0.42 0.98 0.65
touch_addbutton "freeze" "vgui/touch/gmp_fire2" "+attack2" 0.86 0.20 0.98 0.38
touch_addbutton "run" "vgui/touch/gmp_run" "gmp_run" 0.03 0.38 0.13 0.56
touch_addbutton "use" "vgui/touch/gmp_use" "+use" 0.66 0.56 0.78 0.73
touch_addbutton "spawnmenu" "vgui/touch/gmp_spawnmenu" "+menu" 0.04 0.02 0.14 0.13
touch_addbutton "contextmenu" "vgui/touch/gmp_contextmenu" "+menu_context" 0.17 0.02 0.27 0.13
touch_addbutton "pause" "vgui/touch/gmp_menu" "gameui_activate" 0.87 0.02 0.98 0.13
touch_addbutton "prevweapon" "vgui/touch/gmp_prev" "gmp_weapprev" 0.58 0.02 0.67 0.13
touch_addbutton "nextweapon" "vgui/touch/gmp_next" "gmp_weapnext" 0.69 0.02 0.78 0.13
