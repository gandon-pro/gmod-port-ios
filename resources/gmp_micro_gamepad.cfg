// 8BitDo Micro S/D mode, when iOS exposes the device as a GCController.
// No analogue sticks: the D-pad moves, and touch drag on the right looks around.
joy_name "8BitDo Micro"
joy_advanced 1
joy_advaxisx 0
joy_advaxisy 0
joy_advaxisz 0
joy_advaxisr 0
joy_advaxisu 0
joy_advaxisv 0
joystick 1
joy_xcontroller_cfg_loaded 2
joyadvancedupdate
+jlook

bind "UP" "+forward"
bind "DOWN" "+back"
bind "LEFT" "+moveleft"
bind "RIGHT" "+moveright"
bind "A_BUTTON" "+jump"
bind "B_BUTTON" "+duck"
bind "X_BUTTON" "+reload"
bind "Y_BUTTON" "+use"
// L + D-pad is the camera modifier; a short L press cycles weapons in code.
unbind "L_SHOULDER"
bind "R_SHOULDER" "gmp_weapnext"
bind "L_TRIGGER" "+attack2"
bind "R_TRIGGER" "+attack"
bind "BACK" "+menu"
bind "START" "gameui_activate"
// Home is handled by iOS and can open Apple Arcade; do not bind it in game.
unbind "STICK1"
