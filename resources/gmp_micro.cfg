// 8BitDo Micro on iPhone: rear switch K (keyboard mode).
// Assign these single keys to the physical buttons in 8BitDo Ultimate Software.
// D-pad = arrow keys; A=K, B=L, X=R, Y=E;
// L=U, R=O, L2=J, R2=H; -=Q, +=P, Home=C, Star=T.
// The Micro has no analogue look stick: aim with the right half of the touchscreen.
// This file only adds keyboard binds. It does not change the DualSense joystick map.
bind "UPARROW" "+forward"
bind "DOWNARROW" "+back"
bind "LEFTARROW" "+moveleft"
bind "RIGHTARROW" "+moveright"
bind "k" "+jump"
bind "l" "+duck"
bind "r" "+reload"
bind "e" "+use"
bind "u" "gmp_weapprev"
bind "o" "gmp_weapnext"
bind "j" "+attack2"
bind "h" "+attack"
bind "q" "+menu"
bind "p" "gameui_activate"
// Heart: camera modifier while held with the D-pad.
unbind "c"
bind "t" "gmp_toolnext"
