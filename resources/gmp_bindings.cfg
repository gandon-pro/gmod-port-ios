// Command aliases are not part of touch.cfg. Load them without resetting layout.
alias gmp_run_on "+speed; alias gmp_run gmp_run_off"
alias gmp_run_off "-speed; alias gmp_run gmp_run_on"
alias gmp_run gmp_run_on
// The Micro is a Bluetooth keyboard on iOS. Load its explicit keyboard profile;
// SDL game controllers continue to use gmp_gamepad.cfg when connected.
exec gmp_micro.cfg
// GMod: hold B for the suit zoom.
bind "b" "+zoom"
