// Command aliases are not part of touch.cfg. Load them without resetting layout.
alias gmp_run_on "+speed; alias gmp_run gmp_run_off"
alias gmp_run_off "-speed; alias gmp_run gmp_run_on"
alias gmp_run gmp_run_on
// Hardware keyboards and the 8BitDo Micro in K mode: GMod binds ENTER to +attack but has no key for
// +attack2 (MOUSE2 only).
bind "j" "+attack2"
// Tool gun mode (gmp_toolgun.inl); also C menu > Tools and the D-pad right on a controller.
bind "t" "gmp_toolnext"
