// Desktop high-quality settings supported by the Source renderer.
// Hardware capabilities still govern HDR, shadow and water shader availability.
fps_max 999
mat_vsync 0
gl_swapinterval 0
mat_picmip 0
mat_forceaniso 16
mat_trilinear 1
r_rootlod 0
r_lod -1
r_shadows 1
r_shadowrendertotexture 1
r_drawdetailprops 1
r_waterforceexpensive 1
r_waterforcereflectentities 1
mat_reducefillrate 0
mat_bumpmap 1
mat_specular 1
mat_phong 1
mat_hdr_level 2
mat_colorcorrection 1
